<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CircleSCSE</title>
  <style>
  /* 1. 배경과 글자색을 부드럽게 (새까만 검정 ❌ -> 세련된 슬레이트 그레이 ⭕) */
  body {
    font-size: 17px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
    line-height: 1.7;
    max-width: 1050px;
    margin: 0 auto;
    padding: 40px 16px;
    
    background-color: #fafafa; /* 완전 쨍한 흰색 대신 눈이 편안한 초경량 오프화이트 */
    color: #475569;            /* 먹색 대신 부드러운 슬레이트 그레이 (무게감 대폭 감소) */
    word-break: keep-all;
  }

  /* 2. 제목 글자색 (너무 진하지 않은 다크 네이비 톤) */
  h1, h2, h3, h4 {
    color: #0f172a;
    font-weight: 700;
  }

  /* 3. 상단 헤더 & 구분선 가볍게 */
  header {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 15px;
    border-bottom: 1px solid #f1f5f9; /* 구분선 투명도 조절 */
  }

  /* 4. 버튼을 무거운 파란색 대신 '은은하고 가벼운 소프트 블루'로 변경 */
  .btn-download {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background-color: #f0f7ff; /* 연한 하늘빛 배경 */
    color: #2563eb !important;  /* 깔끔한 블루 텍스트 */
    border: 1px solid #dbeafe;  /* 얇고 가벼운 테두리 */
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 20px;       /* 둥근 캡슐형으로 부드러운 느낌 */
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s ease;
  }

  .btn-download:hover {
    background-color: #2563eb;
    color: #ffffff !important;
    transform: translateY(-1px);
  }

  /* 5. 링크 색상도 튀는 파란색 대신 소프트한 블루로 */
  a {
    color: #3b82f6;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }

  /* 6. 구분선(hr) 부드럽게 */
  hr {
    border: none;
    border-top: 1px solid #e2e8f0;
    margin: 40px 0;
  }

  /* 7. PDF 뷰어 프레임 */
  .pdf-container {
    width: 100%;
    height: 750px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
    background-color: #ffffff;
  }
</style>
</head>
<body>

  <header>
    <!-- 상단에 위치한 깔끔한 다운로드 버튼 -->
    <a href="{{ '/assets/CV.pdf' | relative_url }}" download="원성범_CV.pdf" class="btn-download">
      📥 CV 다운로드 (PDF)
    </a>
  </header>

  <main>
    <!-- README.md 본문이 렌더링되는 곳 -->
    {{ content }}

    <!-- PDF 임베딩 영역 -->
    <section class="pdf-preview-section">
      <h3>📄 CV 미리보기</h3>
      
      <div class="pdf-container">
        <!-- iframe이 object보다 브라우저 호환성이 훨씬 우수합니다 -->
        <iframe src="{{ '/assets/CV.pdf' | relative_url }}"></iframe>
      </div>

      <div class="pdf-mobile-fallback">
        <p>화면에서 PDF가 보이지 않으시나요? 
          <a href="{{ '/assets/CV.pdf' | relative_url }}" download="원성범_CV.pdf" style="color: #2563eb; font-weight: bold;">
            여기를 눌러 직접 다운로드
          </a>하세요.
        </p>
      </div>
    </section>
  </main>

</body>
</html>
