<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CircleSCSE</title>
  <style>
    body {
      font-size: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      color: #333333;
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <header>
    <!-- 상단 네비게이션에 다운로드 버튼 배치 -->
    <a href="{{ '/assets/portfolio.pdf' | relative_url }}" download="OOO_포트폴리오.pdf" class="btn-download">
      PDF 다운로드
    </a>
  </header>
  <main>
    <!-- README.md의 내용이 들어가는 자리 -->
    {{ content }}
    <!-- 필요하다면 본문 아래에 PDF 미리보기 영역 배치 -->
    <section class="pdf-preview-section">
      <h3>포트폴리오 문서</h3>
      <object data="{{ '/assets/portfolio.pdf' | relative_url }}" type="application/pdf" width="100%" height="800px">
        <p>미리보기를 지원하지 않는 기기입니다. <a href="{{ '/assets/portfolio.pdf' | relative_url }}" download>PDF 다운로드</a></p>
      </object>
    </section>
  </main>
</body>
</html>
